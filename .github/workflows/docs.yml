name: Deploy docs

# Publishes the Sphinx site to GitHub Pages on every push to main.
#
# The CI workflow already builds the docs with warnings-as-errors on every push
# and pull request; that is the gate. This one only deploys, so a broken build
# never reaches the site and a deployment failure never masks a doc error.
#
# Needs Pages enabled with "GitHub Actions" as the source, once, in
# Settings -> Pages. Pages on a private repository requires a paid plan; on a
# public repository it is free.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the two below are the minimum Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight -- an interrupted
# deploy can leave the site on a half-uploaded artefact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs deps
        # conf.py mocks torch for autodoc, but installing the package still
        # pulls its dependencies, and torch from the default index is a ~2.5 GB
        # CUDA build. The CPU wheel satisfies torch>=2.0 for a fraction of that.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"

      - name: Build docs (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
